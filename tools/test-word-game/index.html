<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>语义猜词 · 手机直播画面</title>
  <link rel="stylesheet" href="./live-layout.css" />
</head>
<body>
<div id="viewport" class="viewport">
<main id="gameRoot" class="game-root">
  <div class="top-overlay-safe-zone" aria-hidden="true"></div>
  <section class="round-header">
    <div class="round-top"><strong id="roundNo">第 1 局</strong><div id="timer" class="timer">04:00</div><div class="hint-status"><b id="hintCount">提示 0/4</b><span id="nextHint">等待开局</span></div></div>
    <div class="timeline-track"><div id="timelineProgress" class="timeline-progress"></div><i class="timeline-marker"></i><i class="timeline-marker"></i><i class="timeline-marker"></i></div>
    <div class="subject-line"><h1 id="partOfSpeech">猜词挑战</h1><span class="answer-pill">答案 <b id="answerLength">—</b></span></div>
  </section>
  <section class="main-panel">
    <section class="panel guess-panel">
      <div class="panel-head"><h2>实时猜词</h2><span id="guessPanelNote" class="panel-note">关联度由高到低</span></div>
      <div class="guess-head"><span>观众</span><span>段位</span><span>猜词</span><span>关联度</span></div>
      <div id="guessTable" class="guess-table"></div>
    </section>
    <aside class="panel leaderboard-panel">
      <div class="panel-head"><h2>积分榜</h2><span id="scoreboardCount" class="panel-note">前20</span></div>
      <div id="scoreboard" class="scoreboard"></div>
      <div id="rankFocus" class="rank-focus">本轮参与，争取上榜</div>
      <div id="previousResult" class="previous-result"><span>上一局</span><strong>等待揭晓</strong></div>
    </aside>
  </section>
  <section id="giftAbility" class="interaction-stage">
    <div class="interaction-heading"><strong>✧ 礼物助力</strong><span id="giftFlowStatus">感谢每一份支持</span></div>
    <div id="giftDanmaku" class="gift-danmaku"></div>
    <div id="latestGuess" class="latest-guess" aria-live="polite"><div class="empty action-empty">等待本局触发动作…</div></div>
  </section>
  <section class="bottom-panel" aria-hidden="true"></section>
  <div class="bottom-overlay-safe-zone" aria-hidden="true"></div>
  <div id="entryLayer" class="entry-layer"></div>
  <div id="floatRail" class="float-rail"></div><div id="toastLayer" class="toast-layer"></div>
  <section id="winnerModal" class="winner-modal hidden" role="dialog" aria-label="本局结算">
    <div class="winner-card">
      <span id="winnerKicker" class="winner-kicker">本轮揭晓</span>
      <h2 id="winnerWord" class="winner-word">—</h2>
      <div id="winnerHero" class="winner-main"><div id="winnerAvatar"></div><div class="winner-identity"><strong id="winnerTitle">暂无赢家</strong><b id="winnerReward">—</b></div></div>
      <p id="winnerCopy" class="winner-copy"></p>
      <div id="winnerRankCopy" class="winner-rank"></div>
      <div class="award-section"><h3>相似度奖励</h3><div id="similarityAwards" class="award-grid"></div></div>
      <div class="award-section"><h3>最佳助攻</h3><div id="assistAward" class="award-grid"></div></div>
      <p class="next-round"><b id="settlementCountdown">—</b><span id="settlementNextLabel">秒后进入下一局</span></p>
    </div>
  </section>
</main>
</div>
<script src="./live-game.js"></script>
<script src="./live-effects.js"></script>
<script src="./live-presentation.js"></script>
<script src="./overlay-core.js"></script>
<script src="./celebration-overlay.js"></script>
<script src="./gift-barrage.js"></script>
<link rel="stylesheet" href="./emotion-overlays.css" />
<script src="./live-demo.js"></script>
<script>
  const overlays = new OverlayManager();
  setInterval(() => { if (state.round) { renderRound(); renderTimeline(); } renderSettlementClock(); }, 250);
  renderAll();
  if (params.has('demo')) runDemo(params.get('demo') || 'showcase');
  else void connect();
</script>
</body>
</html>
