<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>抖音后台与游戏分屏</title>
<style>*{box-sizing:border-box}body{margin:0;background:#08090d;color:#fff;font-family:"Microsoft YaHei UI",sans-serif}.bar{height:42px;display:flex;align-items:center;justify-content:center;gap:12px;background:#11131a;border-bottom:1px solid #292c37;font-size:13px}.bar b{color:#25f4ee}.split{height:calc(100vh - 42px);display:grid;grid-template-columns:minmax(520px,1fr) minmax(390px,.62fr);gap:2px;background:#292c37}iframe{width:100%;height:100%;border:0;background:#fff}@media(max-width:900px){.split{grid-template-columns:1fr}.split iframe:first-child{display:none}}</style></head>
<body><div class="bar"><b>抖音独立后台</b><span>左侧控制数据任务 · 右侧为直播游戏画面</span></div><div class="split"><iframe src="/douyin-admin/" title="抖音后台"></iframe><iframe src="/test-word-game/" title="语义猜词游戏"></iframe></div></body></html>
